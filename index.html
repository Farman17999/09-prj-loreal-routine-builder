<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Playfair+Display:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <!-- RTL toggle (LevelUp): flips the whole layout right-to-left -->
        <button id="rtlToggle" class="rtl-toggle" type="button" aria-pressed="false">
          <i class="fa-solid fa-language"></i>
          <span id="rtlLabel">RTL</span>
        </button>

        <img src="img/loreal-logo.png" alt="L'Oréal Logo" class="logo" />
        <h1 class="site-title">Smart Routine &amp; Product Advisor</h1>
        <p class="site-tagline">Because you're worth it — build a routine made for you.</p>
      </header>

      <!-- Category Filter + Keyword Search (LevelUp) -->
      <div class="search-section">
        <label for="categoryFilter" class="visually-hidden">Category</label>
        <select id="categoryFilter">
          <option value="" disabled selected>Choose a Category</option>
          <option value="all">All Products</option>
          <option value="cleanser">Cleansers</option>
          <option value="moisturizer">Moisturizers & Treatments</option>
          <option value="skincare">Skincare</option>
          <option value="haircare">Haircare</option>
          <option value="makeup">Makeup</option>
          <option value="hair color">Hair Color</option>
          <option value="hair styling">Hair Styling</option>
          <option value="men's grooming">Men's Grooming</option>
          <option value="suncare">Suncare</option>
          <option value="fragrance">Fragrance</option>
        </select>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label for="productSearch" class="visually-hidden">Search products</label>
          <input
            id="productSearch"
            type="search"
            placeholder="Search by name, brand, or keyword…"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Products Grid -->
      <div id="productsContainer" class="products-grid" aria-live="polite"></div>

      <!-- Selected Products -->
      <div class="selected-products">
        <div class="selected-header">
          <h2>Selected Products <span id="selectedCount" class="count-badge">0</span></h2>
          <button id="clearAll" class="clear-btn" type="button">
            <i class="fa-solid fa-trash-can"></i> Clear all
          </button>
        </div>
        <div id="selectedProductsList"></div>
        <button id="generateRoutine" class="generate-btn">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Routine
        </button>
      </div>

      <!------- Chat Area ------->
      <section class="chatbox">
        <div class="chat-header">
          <h2>Let's Build Your Routine</h2>
          <!-- Web search toggle (LevelUp) -->
          <label class="web-toggle">
            <input type="checkbox" id="webSearchToggle" />
            <span><i class="fa-solid fa-globe"></i> Live web search</span>
          </label>
        </div>
        <div id="chatWindow" class="chat-window" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">Message</label>
          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask me about products or routines…"
            autocomplete="off"
            required
          />
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
            <span class="visually-hidden">Send</span>
          </button>
        </form>
      </section>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <!-- Product description modal (hidden until a "Details" button is clicked) -->
    <div id="productModal" class="modal" hidden>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button id="modalClose" class="modal-close" type="button" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="modalImage" src="" alt="" />
        <p id="modalBrand" class="modal-brand"></p>
        <h3 id="modalTitle"></h3>
        <p id="modalCategory" class="modal-category"></p>
        <p id="modalDescription"></p>
        <button id="modalSelect" class="generate-btn" type="button"></button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
